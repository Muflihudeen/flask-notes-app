<!DOCTYPE html>
<html>

<head>
    <title>Add Note</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Add Note </h1>

    <form method="POST">

        <textarea name="content"
                  placeholder="Write your note..."
                  required></textarea>

        <button type="submit">
            Save Note
        </button>

    </form>

</div>

</body>
</html>
